<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jazz Voicing Studio</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <script src="https://cloudflare.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: #1e293b; padding: 8px 12px; border-bottom: 1px solid #334155; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .btn-group { display: flex; gap: 4px; background: #0f172a; padding: 3px; border-radius: 8px; }
    button, select, input { background: #1e293b; color: #f8fafc; border: 1px solid #334155; padding: 6px 10px; border-radius: 6px; font-size: 13px; }
    button { cursor: pointer; font-weight: 600; }
    button.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
    button.play-btn { background: #10b981; color: #0f172a; border: none; }
    .prompt-bar { display: flex; gap: 6px; padding: 8px 12px; background: #162032; border-bottom: 1px solid #334155; }
    .prompt-bar input { flex: 1; background: #0f172a; }
    main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .pane { flex: 1; overflow-y: auto; padding: 10px; }
    .hidden { display: none !important; }
    .grid-controls { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
    .spreadsheet { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; min-height: 120px; }
    .cell { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 10px 6px; text-align: center; min-height: 56px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; }
    .cell.selected { border: 2px solid #38bdf8; background: #1e3a5f; }
    .cell.playing { border: 2px solid #10b981; background: #064e3b; }
    .cell-chord { font-weight: 700; font-size: 13px; color: #38bdf8; }
    .cell-notes { font-size: 11px; color: #94a3b8; margin-top: 3px; }
    .library-bar { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .voicing-chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; min-height: 44px; }
    .chip { background: #273549; border: 1px solid #38bdf8; color: #f8fafc; padding: 6px 12px; border-radius: 16px; white-space: nowrap; font-size: 12px; cursor: pointer; }
    #keyboard-pane { background: #090d16; border-top: 2px solid #334155; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; flex: 0 0 auto; }
    .kb-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 12px; }
    .piano { position: relative; display: flex; height: 145px; width: 100%; overflow-x: auto; user-select: none; background: #0f172a; }
    .white-key { flex: 1; min-width: 36px; height: 140px; background: #f8fafc; border: 1px solid #64748b; border-radius: 0 0 5px 5px; position: relative; z-index: 1; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; color: #0f172a; font-size: 10px; font-weight: bold; }
    .black-key { width: 24px; height: 85px; background: #0f172a; border: 1px solid #475569; border-radius: 0 0 4px 4px; margin-left: -12px; margin-right: -12px; z-index: 2; }
    .key.active { background: #f59e0b !important; color: #000000 !important; }
  </style>
</head>
<body>

  <header>
    <div class="btn-group">
      <button id="view-split" class="active" onclick="setView('split')">Split</button>
      <button id="view-sheet" onclick="setView('sheet')">Sheet</button>
      <button id="view-keys" onclick="setView('keys')">Keys</button>
    </div>
    <select id="tone-select" onchange="changeTone(this.value)">
      <option value="rhodes">Electric Piano (Rhodes)</option>
      <option value="grand">Warm Grand</option>
      <option value="pad">Neo-Soul Pad</option>
      <option value="organ">Jazz Organ</option>
    </select>
    <button class="play-btn" id="play-btn" onclick="togglePlay()">▶ Play</button>
  </header>

  <div class="prompt-bar">
    <input type="text" id="prompt-input" placeholder="Prompt: e.g. 4/4 | Dm9 | G13 | Cmaj9 | A7alt" />
    <button onclick="runPrompt()">Generate</button>
  </div>

  <main>
    <div id="sheet-pane" class="pane">
      <div class="grid-controls">
        <label>Key:</label>
        <select id="root-key">
          <option value="0">C</option><option value="1">C# / Db</option><option value="2">D</option>
          <option value="3">D# / Eb</option><option value="4">E</option><option value="5">F</option>
          <option value="6">F# / Gb</option><option value="7">G</option><option value="8">G# / Ab</option>
          <option value="9">A</option><option value="10">A# / Bb</option><option value="11">B</option>
        </select>
        <select id="time-sig" onchange="clearGrid()">
          <option value="4">4/4 Time</option>
          <option value="3">3/4 Time</option>
          <option value="6">6/8 Time</option>
        </select>
        <button onclick="addRow()">+ Bar</button>
        <button onclick="clearGrid()">Clear</button>
      </div>

      <div id="spreadsheet" class="spreadsheet"></div>

      <div class="library-bar">
        <input type="text" id="search-voicing" placeholder="Search 1000s of voicings..." oninput="renderLibrary()" style="flex:1;" />
        <button onclick="saveCurrentKeysAsTemplate()">+ Save Keys as Template</button>
      </div>
      <div id="voicing-chips" class="voicing-chips"></div>
    </div>

    <div id="keyboard-pane" class="pane">
      <div class="kb-toolbar">
        <span id="active-notes-display">Tap keys to build a voicing or select a cell</span>
        <button onclick="clearActiveKeys()">Clear Keys</button>
      </div>
      <div id="piano" class="piano"></div>
    </div>
  </main>

  <script>
    var synth = null;
    var noteNames = "C,C#,D,D#,E,F,F#,G,G#,A,A#,B".split(",");

    function initAudio(toneType) {
      if (typeof Tone === "undefined") return;
      if (synth) synth.dispose();
      var presets = {
        rhodes: { oscillator: { type: "sine" }, envelope: { attack: 0.02, decay: 0.8, sustain: 0.3, release: 1.5 } },
        grand: { oscillator: { type: "triangle" }, envelope: { attack: 0.01, decay: 1.2, sustain: 0.2, release: 1.8 } },
        pad: { oscillator: { type: "sawtooth" }, envelope: { attack: 0.4, decay: 0.5, sustain: 0.8, release: 2.0 } },
        organ: { oscillator: { type: "square" }, envelope: { attack: 0.05, decay: 0.1, sustain: 0.9, release: 0.3 } }
      };
      synth = new Tone.PolySynth(Tone.Synth, presets[toneType || "rhodes"]).toDestination();
      synth.volume.value = -6;
    }

    function changeTone(toneType) {
      if (typeof Tone !== "undefined") {
        Tone.start().then(function() { initAudio(toneType); });
      }
    }

    function playMidiNotes(midiArray, duration) {
      if (typeof Tone === "undefined") return;
      if (!synth) initAudio("rhodes");
      Tone.start().then(function() {
        var freqs = midiArray.map(function(m) { return Tone.Frequency(m, "midi").toNote(); });
        synth.triggerAttackRelease(freqs, duration || "2n");
      });
    }

    var defaultVoicings = [
      { name: "Maj9 (Rootless)", intervals: "4,7,11,14".split(",").map(Number) },
      { name: "Maj13 (#11)", intervals: "4,11,14,18,21".split(",").map(Number) },
      { name: "m9 (So What)", intervals: "3,8,13,18,22".split(",").map(Number) },
      { name: "m11 (Neo-Soul)", intervals: "3,7,10,14,17".split(",").map(Number) },
      { name: "13 (Bill Evans)", intervals: "4,10,14,21".split(",").map(Number) },
      { name: "7alt (#9 #5)", intervals: "4,8,10,15".split(",").map(Number) },
      { name: "7b9 (Dim)", intervals: "4,7,10,13,21".split(",").map(Number) },
      { name: "m7b5 (Half-Dim)", intervals: "3,6,10,14".split(",").map(Number) },
      { name: "6/9", intervals: "4,9,14,19".split(",").map(Number) },
      { name: "Sus13", intervals: "5,10,14,21".split(",").map(Number) }
    ];

    var voicingLibrary = defaultVoicings;
    try {
      var saved = localStorage.getItem("jazzVoicings");
      if (saved) voicingLibrary = JSON.parse(saved);
    } catch (e) {}

    function saveLibrary() {
      try { localStorage.setItem("jazzVoicings", JSON.stringify(voicingLibrary)); } catch (e) {}
    }

    var activeKeys = new Set();
    var selectedCellIndex = 0;
    var gridCells = [];
    for (var i = 0; i < 16; i++) gridCells.push(null);
    var isPlaying = false;
    var playInterval = null;

    function midiToName(midi) {
      return noteNames[midi % 12] + (Math.floor(midi / 12) - 1);
    }

    function renderSpreadsheet() {
      var container = document.getElementById("spreadsheet");
      var cols = parseInt(document.getElementById("time-sig").value) || 4;
      container.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
      container.innerHTML = "";

      for (var idx = 0; idx < gridCells.length; idx++) {
        (function(index) {
          var cell = gridCells[index];
          var div = document.createElement("div");
          div.className = "cell" + (index === selectedCellIndex ? " selected" : "");
          div.id = "cell-" + index;
          div.onclick = function() { selectCell(index); };

          if (cell) {
            var noteLabels = cell.midi.map(function(m) { return noteNames[m % 12]; }).join("-");
            div.innerHTML = "<div class='cell-chord'>" + cell.label + "</div><div class='cell-notes'>" + noteLabels + "</div>";
          } else {
            div.innerHTML = "<div class='cell-notes'>Beat " + ((index % cols) + 1) + "</div>";
          }
