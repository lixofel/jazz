  <script>
    var synth = null;
    var noteNames = "C,C#,D,D#,E,F,F#,G,G#,A,A#,B".split(",");

    function initAudio(toneType) {
      if (typeof Tone === "undefined") return;
      if (synth) synth.dispose();
      var presets = {
        rhodes: { oscillator: { type: "sine" }, envelope: { attack: 0.02, decay: 0.8, sustain: 0.3, release: 1.5 } },
        grand: { oscillator: { type: "triangle" }, envelope: { attack: 0.01, decay: 1.2, sustain: 0.2, release: 1.8 } },
        pad: { oscillator: { type: "sawtooth" }, envelope: { attack: 0.4, decay: 0.5, sustain: 0.8, release: 2.0 } },
        organ: { oscillator: { type: "square" }, envelope: { attack: 0.05, decay: 0.1, sustain: 0.9, release: 0.3 } }
      };
      synth = new Tone.PolySynth(Tone.Synth, presets[toneType || "rhodes"]).toDestination();
      synth.volume.value = -6;
    }

    function changeTone(toneType) {
      if (typeof Tone !== "undefined") {
        Tone.start().then(function() { initAudio(toneType); });
      }
    }

    function playMidiNotes(midiArray, duration) {
      if (typeof Tone === "undefined") return;
      if (!synth) initAudio("rhodes");
      Tone.start().then(function() {
        var freqs = midiArray.map(function(m) { return Tone.Frequency(m, "midi").toNote(); });
        synth.triggerAttackRelease(freqs, duration || "2n");
      });
    }

    var defaultVoicings = [
      { name: "Maj9 (Rootless)", intervals: "4,7,11,14".split(",").map(Number) },
      { name: "Maj13 (#11)", intervals: "4,11,14,18,21".split(",").map(Number) },
      { name: "m9 (So What)", intervals: "3,8,13,18,22".split(",").map(Number) },
      { name: "m11 (Neo-Soul)", intervals: "3,7,10,14,17".split(",").map(Number) },
      { name: "13 (Bill Evans)", intervals: "4,10,14,21".split(",").map(Number) },
      { name: "7alt (#9 #5)", intervals: "4,8,10,15".split(",").map(Number) },
      { name: "7b9 (Dim)", intervals: "4,7,10,13,21".split(",").map(Number) },
      { name: "m7b5 (Half-Dim)", intervals: "3,6,10,14".split(",").map(Number) },
      { name: "6/9", intervals: "4,9,14,19".split(",").map(Number) },
      { name: "Sus13", intervals: "5,10,14,21".split(",").map(Number) }
    ];

    var voicingLibrary = defaultVoicings;
    try {
      var saved = localStorage.getItem("jazzVoicings");
      if (saved) voicingLibrary = JSON.parse(saved);
    } catch (e) {}

    function saveLibrary() {
      try { localStorage.setItem("jazzVoicings", JSON.stringify(voicingLibrary)); } catch (e) {}
    }

    var activeKeys = new Set();
    var selectedCellIndex = 0;
    var gridCells = [];
    for (var i = 0; i < 16; i++) gridCells.push(null);
    var isPlaying = false;
    var playInterval = null;

    function midiToName(midi) {
      return noteNames[midi % 12] + (Math.floor(midi / 12) - 1);
    }

    function renderSpreadsheet() {
      var container = document.getElementById("spreadsheet");
      var cols = parseInt(document.getElementById("time-sig").value) || 4;
      container.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
      container.innerHTML = "";

      gridCells.forEach(function(cell, index) {
        var div = document.createElement("div");
        div.className = "cell" + (index === selectedCellIndex ? " selected" : "");
        div.id = "cell-" + index;
        div.onclick = function() { selectCell(index); };

        if (cell) {
          var noteLabels = cell.midi.map(function(m) { return noteNames[m % 12]; }).join("-");
          div.innerHTML = "<div class='cell-chord'>" + cell.label + "</div><div class='cell-notes'>" + noteLabels + "</div>";
        } else {
          div.innerHTML = "<div class='cell-notes'>Beat " + ((index % cols) + 1) + "</div>";
        }
        container.appendChild(div);
      });
    }

    function selectCell(idx) {
      selectedCellIndex = idx;
      renderSpreadsheet();
      var cell = gridCells.slice(idx, idx + 1).pop();
      if (cell && cell.midi.length > 0) {
        activeKeys = new Set(cell.midi);
        syncKeyboardUI();
        playMidiNotes(cell.midi);
      }
    }

    function applyVoicingToSelectedCell(voicing) {
      var rootOffset = parseInt(document.getElementById("root-key").value) || 0;
      var rootName = noteNames[rootOffset];
      var baseMidi = 48 + rootOffset;
      var transposedMidi = voicing.intervals.map(function(interval) { return baseMidi + interval; });

      gridCells.splice(selectedCellIndex, 1, { label: rootName + " " + voicing.name, midi: transposedMidi });
      activeKeys = new Set(transposedMidi);
      syncKeyboardUI();
      renderSpreadsheet();
      playMidiNotes(transposedMidi);

      if (selectedCellIndex < gridCells.length - 1) {
        selectedCellIndex++;
        renderSpreadsheet();
      }
    }

    function addRow() {
      var cols = parseInt(document.getElementById("time-sig").value) || 4;
      for (var i = 0; i < cols; i++) gridCells.push(null);
      renderSpreadsheet();
    }

    function clearGrid() {
      var cols = parseInt(document.getElementById("time-sig").value) || 4;
      gridCells = [];
      for (var i = 0; i < cols * 4; i++) gridCells.push(null);
      selectedCellIndex = 0;
      renderSpreadsheet();
    }

    function buildKeyboard() {
      var piano = document.getElementById("piano");
      piano.innerHTML = "";
      for (var midi = 48; midi <= 83; midi++) {
        (function(m) {
          var noteIndex = m % 12;
          var isBlack = (noteIndex === 1 || noteIndex === 3 || noteIndex === 6 || noteIndex === 8 || noteIndex === 10);
          var key = document.createElement("div");
          key.className = "key " + (isBlack ? "black-key" : "white-key");
          key.setAttribute("data-midi", m);
          if (!isBlack) key.textContent = midiToName(m);
          key.onclick = function() { togglePianoKey(m); };
          piano.appendChild(key);
        })(midi);
      }
    }

    function togglePianoKey(midi) {
      if (activeKeys.has(midi)) {
        activeKeys.delete(midi);
      } else {
        activeKeys.add(midi);
        var single = [];
        single.push(midi);
        playMidiNotes(single, "8n");
      }
      syncKeyboardUI();
    }

    function syncKeyboardUI() {
      var keys = document.querySelectorAll(".key");
      keys.forEach(function(k) {
        var m = parseInt(k.getAttribute("data-midi"));
        if (activeKeys.has(m)) k.classList.add("active");
        else k.classList.remove("active");
      });
      var sorted = Array.from(activeKeys).sort(function(a, b) { return a - b; });
      document.getElementById("active-notes-display").textContent =
        sorted.length ? "Selected: " + sorted.map(midiToName).join(" ") : "Tap keys to build a voicing or select a cell";
    }

    function clearActiveKeys() {
      activeKeys.clear();
      syncKeyboardUI();
    }

    function saveCurrentKeysAsTemplate() {
      var sorted = Array.from(activeKeys).sort(function(a, b) { return a - b; });
      if (sorted.length < 2) {
        alert("Tap at least 2 notes on the keyboard first to save a voicing template.");
        return;
      }
      var name = prompt("Name this voicing template (e.g., My Dark m11, Gospel Drop-2):");
      if (!name) return;

      var rootOffset = parseInt(document.getElementById("root-key").value) || 0;
      var lowestNote = sorted.slice(0, 1).pop();
      var rootMidi = lowestNote - ((lowestNote - rootOffset) % 12);
      var intervals = sorted.map(function(m) { return m - rootMidi; });

      voicingLibrary.unshift({ name: name, intervals: intervals });
      saveLibrary();
      renderLibrary();
    }

    function renderLibrary() {
      var query = document.getElementById("search-voicing").value.toLowerCase();
      var container = document.getElementById("voicing-chips");
      container.innerHTML = "";

      voicingLibrary.forEach(function(voicing) {
        if (voicing.name.toLowerCase().indexOf(query) !== -1) {
          var chip = document.createElement("div");
          chip.className = "chip";
          chip.textContent = voicing.name;
          chip.onclick = function() { applyVoicingToSelectedCell(voicing); };
          container.appendChild(chip);
        }
      });
    }

    function setView(mode) {
      var sheet = document.getElementById("sheet-pane");
      var keys = document.getElementById("keyboard-pane");
      document.querySelectorAll("header .btn-group button").forEach(function(b) { b.classList.remove("active"); });
      document.getElementById("view-" + mode).classList.add("active");

      if (mode === "split") { sheet.classList.remove("hidden"); keys.classList.remove("hidden"); }
      else if (mode === "sheet") { sheet.classList.remove("hidden"); keys.classList.add("hidden"); }
      else if (mode === "keys") { sheet.classList.add("hidden"); keys.classList.remove("hidden"); }
    }

    function togglePlay() {
      var btn = document.getElementById("play-btn");
      if (isPlaying) {
        isPlaying = false;
        clearInterval(playInterval);
        btn.textContent = "▶ Play";
        document.querySelectorAll(".cell").forEach(function(c) { c.classList.remove("playing"); });
        return;
      }

      isPlaying = true;
      btn.textContent = "⏹ Stop";
      var step = 0;

      var tick = function() {
        document.querySelectorAll(".cell").forEach(function(c) { c.classList.remove("playing"); });
        var currentEl = document.getElementById("cell-" + step);
        if (currentEl) currentEl.classList.add("playing");

        var cell = gridCells.slice(step, step + 1).pop();
        if (cell && cell.midi.length > 0) {
          playMidiNotes(cell.midi, "2n");
          activeKeys = new Set(cell.midi);
          syncKeyboardUI();
        }
        step = (step + 1) % gridCells.length;
      };

      tick();
      playInterval = setInterval(tick, 900);
    }

    function runPrompt() {
      var raw = document.getElementById("prompt-input").value.trim();
      if (!raw) return;
