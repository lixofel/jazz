<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jazz Voicing Studio</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <script src="https://cloudflare.com"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --active-key: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: var(--panel); padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .btn-group { display: flex; gap: 4px; background: var(--bg); padding: 3px; border-radius: 8px; }
    button, select, input { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; font-size: 13px; }
    button { cursor: pointer; font-weight: 600; }
    button.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
    button.play-btn { background: #10b981; color: #0f172a; border: none; }
    .prompt-bar { display: flex; gap: 6px; padding: 8px 12px; background: #162032; border-bottom: 1px solid var(--border); }
    .prompt-bar input { flex: 1; background: var(--bg); }
    main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .pane { flex: 1; overflow-y: auto; padding: 10px; }
    .hidden { display: none !important; }
    .grid-controls { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
    .spreadsheet { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .cell { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px 6px; text-align: center; min-height: 58px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; }
    .cell.selected { border: 2px solid var(--accent); background: #1e3a5f; }
    .cell.playing { border: 2px solid #10b981; background: #064e3b; }
    .cell-chord { font-weight: 700; font-size: 14px; color: var(--accent); }
    .cell-notes { font-size: 10px; color: var(--muted); margin-top: 3px; }
    .library-bar { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .voicing-chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; }
    .chip { background: #273549; border: 1px solid var(--border); padding: 6px 10px; border-radius: 16px; white-space: nowrap; font-size: 12px; cursor: pointer; }
    #keyboard-pane { background: #090d16; border-top: 2px solid var(--border); display: flex; flex-direction: column; justify-content: space-between; padding: 8px; flex: 0 0 auto; }
    .kb-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 12px; }
    .piano { position: relative; display: flex; height: 140px; width: 100%; overflow-x: auto; user-select: none; }
    .white-key { flex: 1; min-width: 34px; background: #f8fafc; border: 1px solid #94a3b8; border-radius: 0 0 5px 5px; position: relative; z-index: 1; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; color: #334155; font-size: 10px; font-weight: bold; }
    .black-key { width: 22px; height: 85px; background: #0f172a; border: 1px solid #475569; border-radius: 0 0 4px 4px; margin-left: -11px; margin-right: -11px; z-index: 2; }
    .key.active { background: var(--active-key) !important; color: #000; }
  </style>
</head>
<body>

  <header>
    <div class="btn-group">
      <button id="view-split" class="active" onclick="setView('split')">Split</button>
      <button id="view-sheet" onclick="setView('sheet')">Sheet</button>
      <button id="view-keys" onclick="setView('keys')">Keys</button>
    </div>
    <select id="tone-select" onchange="changeTone(this.value)">
      <option value="rhodes">Electric Piano (Rhodes)</option>
      <option value="grand">Warm Grand</option>
      <option value="pad">Neo-Soul Pad</option>
      <option value="organ">Jazz Organ</option>
    </select>
    <button class="play-btn" id="play-btn" onclick="togglePlay()">▶ Play</button>
  </header>

  <div class="prompt-bar">
    <input type="text" id="prompt-input" placeholder="Prompt: e.g. 4/4 | Dm9 | G13 | Cmaj9 | A7alt" />
    <button onclick="runPrompt()">Generate</button>
  </div>

  <main>
    <div id="sheet-pane" class="pane">
      <div class="grid-controls">
        <label>Key:</label>
        <select id="root-key">
          <option value="0">C</option><option value="1">C# / Db</option><option value="2">D</option>
          <option value="3">D# / Eb</option><option value="4">E</option><option value="5">F</option>
          <option value="6">F# / Gb</option><option value="7">G</option><option value="8">G# / Ab</option>
          <option value="9">A</option><option value="10">A# / Bb</option><option value="11">B</option>
        </select>
        <select id="time-sig" onchange="clearGrid()">
          <option value="4">4/4 Time</option>
          <option value="3">3/4 Time</option>
          <option value="6">6/8 Time</option>
        </select>
        <button onclick="addRow()">+ Bar</button>
        <button onclick="clearGrid()">Clear</button>
      </div>

      <div id="spreadsheet" class="spreadsheet"></div>

      <div class="library-bar">
        <input type="text" id="search-voicing" placeholder="Search 1000s of voicings..." oninput="renderLibrary()" style="flex:1;" />
        <button onclick="saveCurrentKeysAsTemplate()">+ Save Keys as Template</button>
      </div>
      <div id="voicing-chips" class="voicing-chips"></div>
    </div>

    <div id="keyboard-pane" class="pane">
      <div class="kb-toolbar">
        <span id="active-notes-display">Tap keys to build a voicing or select a cell</span>
        <button onclick="clearActiveKeys()">Clear Keys</button>
      </div>
      <div id="piano" class="piano"></div>
    </div>
  </main>

  <script>
    let synth = null;
    const noteNames = "C,C#,D,D#,E,F,F#,G,G#,A,A#,B".split(",");

    function initAudio(toneType) {
      if (synth) synth.dispose();
      const presets = {
        rhodes: { oscillator: { type: "sine" }, envelope: { attack: 0.02, decay: 0.8, sustain: 0.3, release: 1.5 } },
        grand: { oscillator: { type: "triangle" }, envelope: { attack: 0.01, decay: 1.2, sustain: 0.2, release: 1.8 } },
        pad: { oscillator: { type: "sawtooth" }, envelope: { attack: 0.4, decay: 0.5, sustain: 0.8, release: 2.0 } },
        organ: { oscillator: { type: "square" }, envelope: { attack: 0.05, decay: 0.1, sustain: 0.9, release: 0.3 } }
      };
      synth = new Tone.PolySynth(Tone.Synth, presets[toneType || "rhodes"]).toDestination();
      synth.volume.value = -6;
    }

    async function changeTone(toneType) {
      await Tone.start();
      initAudio(toneType);
    }

    async function playMidiNotes(midiArray, duration) {
      if (!synth) initAudio("rhodes");
      await Tone.start();
      const freqs = midiArray.map(function(m) { return Tone.Frequency(m, "midi").toNote(); });
      synth.triggerAttackRelease(freqs, duration || "2n");
    }

    const defaultVoicings = [
      { name: "Maj9 (Rootless)", intervals: "4,7,11,14".split(",").map(Number) },
      { name: "Maj13 (#11)", intervals: "4,11,14,18,21".split(",").map(Number) },
      { name: "m9 (So What)", intervals: "3,8,13,18,22".split(",").map(Number) },
      { name: "m11 (Neo-Soul)", intervals: "3,7,10,14,17".split(",").map(Number) },
      { name: "13 (Bill Evans)", intervals: "4,10,14,21".split(",").map(Number) },
      { name: "7alt (#9 #5)", intervals: "4,8,10,15".split(",").map(Number) },
      { name: "7b9 (Dim)", intervals: "4,7,10,13,21".split(",").map(Number) },
      { name: "m7b5 (Half-Dim)", intervals: "3,6,10,14".split(",").map(Number) },
      { name: "6/9", intervals: "4,9,14,19".split(",").map(Number) },
      { name: "Sus13", intervals: "5,10,14,21".split(",").map(Number) }
    ];

    let voicingLibrary = JSON.parse(localStorage.getItem("jazzVoicings")) || defaultVoicings;
    function saveLibrary() { localStorage.setItem("jazzVoicings", JSON.stringify(voicingLibrary)); }

    let activeKeys = new Set();
    let selectedCellIndex = 0;
    let gridCells = Array(16).fill(null);
    let isPlaying = false;
    let playInterval = null;

    function midiToName(midi) {
      return noteNames[midi % 12] + (Math.floor(midi / 12) - 1);
    }

    function renderSpreadsheet() {
      const container = document.getElementById("spreadsheet");
      const cols = parseInt(document.getElementById("time-sig").value);
      container.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
      container.innerHTML = "";

      gridCells.forEach(function(cell, idx) {
        const div = document.createElement("div");
        div.className = "cell" + (idx === selectedCellIndex ? " selected" : "");
        div.id = "cell-" + idx;
        div.onclick = function() { selectCell(idx); };

        if (cell) {
          const noteLabels = cell.midi.map(function(m) { return noteNames[m % 12]; }).join("-");
          div.innerHTML = "<div class='cell-chord'>" + cell.label + "</div><div class='cell-notes'>" + noteLabels + "</div>";
        } else {
          div.innerHTML = "<div class='cell-notes'>Beat " + ((idx % cols) + 1) + "</div>";
        }
        container.appendChild(div);
      });
    }

    function selectCell(idx) {
      selectedCellIndex = idx;
      renderSpreadsheet();
      const cell = gridCells[idx];
let matchedVoicing = voicingLibrary.find(function(v) { return quality && v.name.toLowerCase().includes(quality); });
if (!matchedVoicing) {
if (quality.includes("m")) matchedVoicing = voicingLibrary.find(function(v) { return v.name.toLowerCase().startsWith("m"); });
else if (quality.includes("13") || quality.includes("7") || quality.includes("alt")) matchedVoicing = voicingLibrary.find(function(v) { return v.name.includes("13") || v.name.includes("7"); });
else matchedVoicing = voicingLibrary.at(0);
}
const baseMidi = 48 + rootIdx;
gridCells[idx] = {
label: token + " (" + matchedVoicing.name + ")",
midi: matchedVoicing.intervals.map(function(i) { return baseMidi + i; })
};
});
selectedCellIndex = 0;
renderSpreadsheet();
selectCell(0);
}
buildKeyboard();
renderSpreadsheet();
renderLibrary();
